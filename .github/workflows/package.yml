# The installers, each built by the script a person runs by hand (docs/specs/release.md), on every
# push to a branch other than main, every pull request and by hand, and kept as the run's
# artifacts for 14 days. release.yml calls this workflow on a v* tag and attaches what it builds
# to a GitHub Release; latest.yml calls it on every push to main, for the Latest build release.
#
#   macOS arm64, macOS x64   scripts/package-macos.sh --no-verify, on a Mac of that kind
#   Windows x64              scripts/package-windows.sh, cross-compiled on Ubuntu with mingw-w64
#                            and NSIS, as from any Linux machine (the program is never started:
#                            the CI workflow's Windows job compiles and tests it natively)
#   Ubuntu amd64, arm64      scripts/package-linux.sh <arch>, on a runner of that kind, with
#                            the script's own checks: installed in clean Ubuntu 22.04 and 24.04
#                            containers, started with no network under a virtual display, a
#                            Tutorial Workspace created and its server asked on 127.0.0.1
#
# Not signed by Apple or Microsoft. Built without the updater, except when release.yml or
# latest.yml call this workflow with `updater: true` and the repository has the variable
# INFALL_UPDATE_PUBKEY (the update feed's public key; docs/specs/release.md, section 11): then
# the apps check this repository's releases for a newer one, and the macOS jobs also keep the
# `.app.tar.gz` the updater installs. Nothing is signed here: the release jobs do that. An
# artifact of a branch build is for testing, not to hand out.
name: Packages

on:
  push:
    # Not main: latest.yml builds these there, and puts them in the Latest build release.
    branches: ["**", "!main"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      updater:
        description: Build the apps with the updater (needs the variable INFALL_UPDATE_PUBKEY)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_TOOLCHAIN: "1.96.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  # The updater (see the top): the key, the feed of versions (the newest published release
  # that is not a pre-release) and the feed of beta builds (the Latest build release). All
  # three empty, and so no updater, unless a release workflow asked for it.
  INFALL_UPDATE_PUBKEY: ${{ inputs.updater && vars.INFALL_UPDATE_PUBKEY || '' }}
  INFALL_UPDATE_URL: ${{ inputs.updater && vars.INFALL_UPDATE_PUBKEY && format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) || '' }}
  INFALL_UPDATE_BETA_URL: ${{ inputs.updater && vars.INFALL_UPDATE_PUBKEY && format('https://github.com/{0}/releases/download/latest/latest.json', github.repository) || '' }}

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: package-macos
      # --no-verify: the start check opens a window and lists it; on a shared runner that is
      # not something to rely on. The check is run by hand before a release.
      - name: Package
        run: scripts/package-macos.sh --no-verify
      - name: Name the disk image after its processor
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          for dmg in *.dmg; do mv "$dmg" "${dmg%.dmg}-$ARCH.dmg"; done
          # With the updater: what it installs, named the same way.
          for bundle in *.app.tar.gz; do
            [ -f "$bundle" ] && mv "$bundle" "${bundle%.app.tar.gz}-$ARCH.app.tar.gz"
          done
          shasum -a 256 ./*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: infall-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: mingw-w64 and NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 nsis
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust ${{ env.RUST_TOOLCHAIN }} for x86_64-pc-windows-gnu
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-gnu
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: package-windows
      - name: Package
        run: scripts/package-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: infall-windows-x64
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    name: Ubuntu ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Instead of the script's Docker volume, a folder this cache keeps between runs:
      # downloaded crates, npm's cache and cargo's build output (INFALL_PACKAGE_CACHE below).
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/package-linux-cache
          key: package-linux-${{ matrix.arch }}-rust${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock', 'web/package-lock.json') }}
          restore-keys: |
            package-linux-${{ matrix.arch }}-rust${{ env.RUST_TOOLCHAIN }}-
      - name: Package and check
        env:
          INFALL_PACKAGE_CACHE: ${{ runner.temp }}/package-linux-cache
          INFALL_PACKAGE_RUST: ${{ env.RUST_TOOLCHAIN }}
          ARCH: ${{ matrix.arch }}
        run: scripts/package-linux.sh "$ARCH"
      # The build runs as root in its container; the cache is saved by this runner's user.
      - name: Hand the cache back to the runner's user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${{ runner.temp }}/package-linux-cache" || true
      - uses: actions/upload-artifact@v7
        with:
          name: infall-ubuntu-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
