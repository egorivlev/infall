# The checks a contributor runs by hand (CONTRIBUTING.md), on every push to a branch, every pull
# request and by hand, on Ubuntu, macOS and Windows:
#
#   server    the root workspace (crates/core, crates/server): fmt, clippy, tests
#   web       web/: typecheck, lint, tests, build (Ubuntu only: the same files on every system)
#   desktop   desktop/src-tauri (the app, driver, proc, runner): fmt, clippy, tests
#
# Tests that need a program the runner lacks print a SKIPPED line and pass: matplotlib (figure
# tests), Julia, R and qdk (Q#) in desktop/src-tauri/runner/tests; most Runner and driver tests
# are Unix-only (cfg(unix)) and are not compiled on Windows. --no-fail-fast runs every test
# binary, so one failing file does not hide the others.
#
# Tags do not run this workflow: release.yml builds them.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the packages and the container image are built with.
  RUST_TOOLCHAIN: "1.96.0"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  server:
    name: Server (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      # Windows' git turns LF into CRLF on checkout; tests compare text the repository holds.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        # Also the slow ones marked #[ignore] (a literature review of thirty PDFs).
        run: cargo test --locked --workspace --no-fail-fast -- --include-ignored

  web:
    name: Web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Libraries the app links (WebKitGTK 4.1, GTK 3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libdbus-1-dev
      # The app embeds web/dist when it is compiled (desktop/src-tauri/build.rs), tests included.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # The Runner's tests against a real Python use the runner's own Python.
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked --no-fail-fast
