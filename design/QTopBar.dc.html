<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"><link rel="stylesheet" href="./qoop-theme.css"></helmet>
<div style="position:relative;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 0;background:var(--q-chrome);border-bottom:1px solid var(--q-chrome-line);box-sizing:border-box;color:var(--q-ink);font-family:'IBM Plex Sans',sans-serif;font-size:13px;">
  <sc-if value="{{ notMain }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;right:0;top:0;height:2px;background:var(--q-branch);"></div></sc-if>
  <div style="width:224px;box-sizing:border-box;padding-left:14px;display:flex;align-items:center;gap:9px;height:100%;border-right:1px solid var(--q-chrome-line);flex:none;">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.2" stroke="var(--q-ink)" stroke-width="1.4"></circle><circle cx="11.6" cy="6.4" r="1.9" fill="var(--q-accent)"></circle><path d="M12.6 12.6 L16 16" stroke="var(--q-ink)" stroke-width="1.4" stroke-linecap="round"></path></svg>
    <span style="font-weight:600;letter-spacing:.01em;">Qoop</span>
    <span style="color:var(--q-ink-3);font-size:12px;">QEC Lab</span>
  </div>
  <sc-if value="{{ notGuest }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;display:flex;align-items:center;gap:6px;">
      <button onClick="{{ toggleSwitcher }}" title="Switch Branch" style="white-space:nowrap;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 8px;border-radius:5px;border:1px solid var(--q-cur-branch);background:{{ pillBg }};color:var(--q-ink);font:inherit;cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--q-cur-branch)" stroke-width="1.4" stroke-linecap="round"><circle cx="3.5" cy="3" r="1.6"></circle><circle cx="3.5" cy="11" r="1.6"></circle><circle cx="10.5" cy="5" r="1.6"></circle><path d="M3.5 4.6 V9.4 M10.5 6.6 C10.5 9 3.5 8 3.5 9.4"></path></svg>
        <span style="font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--q-ink-3);">Branch</span>
        <span style="font:600 13px/1 'IBM Plex Mono',monospace;color:var(--q-cur-branch);">{{ branch }}</span>
        <sc-if value="{{ notMain }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:var(--q-ink-2);">from main · 14 Nov</span></sc-if>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="var(--q-ink-3)" stroke-width="1.4"><path d="M2 3.5 L5 6.5 L8 3.5"></path></svg>
      </button>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:36px;left:0;width:340px;z-index:50;background:var(--q-raised);border:1px solid var(--q-line);border-radius:7px;box-shadow:var(--q-shadow);padding:6px;display:flex;flex-direction:column;gap:2px;">
          <div style="padding:6px 8px 4px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--q-ink-3);">Branches</div>
          <sc-for list="{{ branches }}" as="b" hint-placeholder-count="3">
            <div style="display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;background:{{ b.bg }};">
              <span style="font-size:12px;color:var(--q-accent);">{{ b.check }}</span>
              <div style="display:flex;flex-direction:column;gap:2px;">
                <span style="font:500 13px/1.2 'IBM Plex Mono',monospace;color:{{ b.color }};">{{ b.name }}</span>
                <span style="font-size:11px;color:var(--q-ink-3);">{{ b.meta }}</span>
              </div>
              <span style="font:11px 'IBM Plex Mono',monospace;color:var(--q-ink-2);">{{ b.ahead }}</span>
            </div>
          </sc-for>
          <div style="height:1px;background:var(--q-line-soft);margin:4px 2px;"></div>
          <div style="padding:7px 8px;font-size:13px;color:var(--q-ink);">New Branch from now…</div>
          <div style="padding:7px 8px;font-size:13px;color:var(--q-ink);">New Branch from a Checkpoint…</div>
          <div style="padding:7px 8px;font-size:13px;color:var(--q-ink);">Compare and Merge…</div>
        </div>
      </sc-if>
      <button title="Create a named Checkpoint of this Branch" style="white-space:nowrap;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:5px;border:1px solid var(--q-chrome-line);background:transparent;color:var(--q-ink);font:inherit;cursor:pointer;">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 1 L11 6 L6 11 L1 6 Z"></path><circle cx="6" cy="6" r="1.2" fill="currentColor"></circle></svg>Checkpoint
      </button>
      <button title="History" style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:5px;border:1px solid {{ histBorder }};background:{{ histBg }};color:var(--q-ink);font:inherit;cursor:pointer;">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="5"></circle><path d="M6.5 3.5 V6.5 L8.6 7.8"></path></svg>History
      </button>
    </div>
  </sc-if>
  <sc-if value="{{ guest }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:10px;padding-left:4px;">
      <span style="font:600 13px 'IBM Plex Mono',monospace;color:var(--q-ink);">main</span>
      <span style="font-size:12px;color:var(--q-ink-3);">read-only</span>
    </div>
  </sc-if>
  <div style="flex:1;display:flex;justify-content:center;min-width:0;">
    <div style="width:100%;max-width:380px;height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:5px;background:var(--q-sunken);border:1px solid var(--q-chrome-line);color:var(--q-ink-3);box-sizing:border-box;">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="5.6" cy="5.6" r="4"></circle><path d="M8.6 8.6 L12 12"></path></svg>
      <span style="flex:1;font-size:12.5px;">Search Cards, Pages, Sources</span>
      <span style="font:11px 'IBM Plex Mono',monospace;border:1px solid var(--q-line);border-radius:3px;padding:1px 4px;">⌘K</span>
    </div>
  </div>
  <sc-if value="{{ guest }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:5px;border:1px solid var(--q-st-question);color:var(--q-ink);font-size:12.5px;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="var(--q-st-question)" stroke-width="1.3"><circle cx="6" cy="4" r="2.2"></circle><path d="M1.8 11 C2.4 8 9.6 8 10.2 11"></path></svg>
      <span style="font-weight:600;">Guest</span><span style="color:var(--q-ink-2);">— access until 30 Nov</span>
    </div>
  </sc-if>
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--q-ink-3);">{{ presenceLabel }}</span>
    <div style="display:flex;">
      <sc-for list="{{ presence }}" as="p" hint-placeholder-count="3">
        <span title="{{ p.name }}" style="width:24px;height:24px;margin-left:-5px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 10px 'IBM Plex Sans',sans-serif;color:oklch(0.2 0.02 255);background:{{ p.bg }};box-shadow:0 0 0 2px var(--q-chrome);">{{ p.i }}</span>
      </sc-for>
    </div>
  </div>
  <sc-if value="{{ notGuest }}" hint-placeholder-val="{{ true }}">
    <button title="AI sidebar" style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:5px;border:1px solid {{ aiBorder }};background:{{ aiBg }};color:var(--q-ink);font:inherit;cursor:pointer;">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1.5" width="11" height="10" rx="1.5"></rect><path d="M8.5 1.5 V11.5"></path></svg>AI
    </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:300},&quot;branch&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;main&quot;,&quot;try-QEC&quot;],&quot;default&quot;:&quot;main&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;guest&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;switcherOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;history&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ai&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: null };
  renderVals() {
    const branch = this.props.branch || 'main';
    const guest = !!this.props.guest;
    const open = this.state.open ?? !!this.props.switcherOpen;
    const M = { AR: ['Ana Ruiz', 'oklch(0.76 0.08 35)'], JW: ['Jonas Weber', 'oklch(0.76 0.08 240)'], ML: ['Mei Lin (you)', 'oklch(0.78 0.08 160)'], EV: ['Prof. Elena Varga', 'oklch(0.80 0.08 85)'], PN: ['Priya Nair (Guest)', 'oklch(0.80 0.03 255)'] };
    const ids = guest ? ['PN', 'EV'] : branch === 'main' ? ['EV', 'AR', 'ML'] : ['JW', 'ML'];
    const cur = (n) => n === branch;
    const branches = [
      { name: 'main', meta: 'default · Elena, Ana here now', ahead: '' },
      { name: 'try-QEC', meta: 'from Checkpoint “Reading group 14 Nov” · Mei, Jonas', ahead: '14 ahead · 5 behind' },
      { name: 'ana/cartpole-lr', meta: 'from now on 19 Nov · Ana', ahead: '3 ahead' },
    ].map(b => ({ ...b, check: cur(b.name) ? '✓' : '', bg: cur(b.name) ? 'var(--q-hover)' : 'transparent', color: b.name === 'main' ? 'var(--q-ink)' : 'var(--q-branch)' }));
    return {
      branch, guest, notGuest: !guest, notMain: branch !== 'main' && !guest, open,
      toggleSwitcher: () => this.setState({ open: !open }),
      pillBg: branch === 'main' ? 'transparent' : 'color-mix(in oklch, var(--q-branch) 16%, transparent)',
      histBg: this.props.history ? 'var(--q-hover)' : 'transparent', histBorder: this.props.history ? 'var(--q-line)' : 'var(--q-chrome-line)',
      aiBg: this.props.ai ? 'var(--q-hover)' : 'transparent', aiBorder: this.props.ai ? 'var(--q-line)' : 'var(--q-chrome-line)',
      presenceLabel: guest ? 'Viewing' : 'On ' + branch,
      presence: ids.map(i => ({ i, name: M[i][0], bg: M[i][1] })),
      branches,
    };
  }
}
</script>
</body>
</html>
