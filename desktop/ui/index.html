<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheaf</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <h1>Connect to your Sheaf server</h1>
      <p class="lead">Enter the address your team uses to open Sheaf. You only do this once.</p>
      <form id="form" novalidate>
        <label for="address">Server address</label>
        <input
          id="address"
          name="address"
          type="url"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="https://qoop.example.org"
          aria-describedby="hint error"
          required
        />
        <p id="hint" class="hint">Starts with https://. On this computer, http://localhost:8787 also works.</p>
        <p id="error" class="error" role="alert" hidden></p>
        <button id="connect" type="submit">Connect</button>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
