# Drives the Member's own `claude` command for one AI sidebar run.
# No Tauri types here: tested with plain `cargo test` against a stub `claude`.
[package]
name = "infall-claude-driver"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
infall-proc = { path = "../proc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
