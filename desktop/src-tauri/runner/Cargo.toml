# The Runner (docs/specs/desktop.md, "M8 — the Runner"): executes a Run's code on the
# Member's own computer, after the Member approved exactly that code.
# No Tauri types here: the approval rules and the execution are tested with plain
# `cargo test`, the execution against a real Python.
[package]
name = "infall-runner"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
infall-proc = { path = "../proc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
