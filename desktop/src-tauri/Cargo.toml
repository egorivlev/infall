# The Qoop desktop app (docs/specs/desktop.md). Deliberately NOT a member of the
# repository's root workspace: its own lock file and its own target directory.
[workspace]
members = [".", "driver", "proc", "runner"]
default-members = [".", "driver", "proc", "runner"]
resolver = "3"

[package]
name = "qoop-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Qoop desktop app: a thin shell around the server's web UI"

[features]
# Release builds made with plain cargo need this (`cargo tauri build` turns it on by itself):
# the app's own files are then served from inside the binary, never from a dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# No `devtools` feature: release builds have no web inspector.
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
qoop-claude-driver = { path = "driver" }
qoop-runner = { path = "runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = "3"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
