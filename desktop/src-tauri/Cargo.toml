# The Infall desktop app (docs/specs/desktop.md). Deliberately NOT a member of the
# repository's root workspace: its own lock file and its own target directory.
[workspace]
members = [".", "driver", "proc", "runner"]
default-members = [".", "driver", "proc", "runner"]
resolver = "3"

[package]
name = "infall-desktop"
version = "0.9.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Infall desktop app: the server's web UI, and the server itself for Local Workspaces"

# The build that is packaged (scripts/package-macos.sh). Smaller, and nothing else: optimisation
# level and panic behaviour stay cargo's defaults.
[profile.release]
strip = true        # no symbol table in the binary that is handed out
lto = "thin"
codegen-units = 1

[features]
# Release builds made with plain cargo need this (`cargo tauri build` turns it on by itself):
# the app's own files are then served from inside the binary, never from a dev server.
custom-protocol = ["tauri/custom-protocol"]
# In-app updates (docs/specs/release.md, section 11). Only a build that also has
# INFALL_UPDATE_PUBKEY and INFALL_UPDATE_URL set at build time has an updater (see build.rs);
# the packaging scripts turn this on when both are set. Off by default, so a plain build and
# the tests do not even compile the plugin.
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# No `devtools` feature: release builds have no web inspector.
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
# Checks a signed feed, downloads and verifies an update, installs it (feature `updater`).
tauri-plugin-updater = { version = "2.14", optional = true }
infall-claude-driver = { path = "driver" }
infall-runner = { path = "runner" }
# The real server, run in-process for Local Workspaces (docs/specs/local.md, Contract A).
infall-server = { path = "../../crates/server" }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Comparing this version with the update feed's (src/update.rs); the updater plugin's own type.
semver = "1"
ureq = "3"
getrandom = "0.3"
base64 = "0.22"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

# macOS: moving the traffic lights while the window is open (src/chrome.rs). Tauri's own
# runtime, the version Tauri uses (the lock file has one): its runtime plugin and the window
# message Tauri 2.12 has no public setter for.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-runtime-wry = "2.12"

[dev-dependencies]
tempfile = "3"
